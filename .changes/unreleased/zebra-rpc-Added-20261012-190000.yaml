project: zebra-rpc
kind: Added
body: 'Indexer gRPC `GetBlockRange(start, end)`: streams the best-chain blocks at `start..=end` as their stored bytes, ending with `NOT_FOUND` above the tip. `GetBlock` now also serves stored bytes (`ReadRequest::RawBlock`) instead of deserializing and re-serializing the block.'
