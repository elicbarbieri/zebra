project: zebra-chain
kind: breaking
body: 'Parsing a transaction does no curve arithmetic: the Sapling, Orchard and Ironwood point rules are checked by `CompressedTransaction::decompress` instead, with the same upstream checks the parse used to run. The bundle getters and the `sapling_spends()` / `sapling_outputs()` / `orchard_actions()` / `ironwood_actions()` accessors yield the byte-tier types (`BundleBytes`, `SpendDescriptionBytes`, `OutputDescriptionBytes`, `ActionBytes`) on a `CompressedTransaction`. `zcash_note_encryption::decrypts_successfully` returns `Result<bool, DecompressionError>`, so a broken point is not reported as an undecryptable output.'
time: 2026-09-22T12:00:00.000000000Z
