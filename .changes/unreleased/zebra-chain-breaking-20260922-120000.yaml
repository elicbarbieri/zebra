project: zebra-chain
kind: breaking
body: '`transaction::Transaction` now wraps `zcash_primitives::transaction::CompressedTransaction`: parsing does no curve arithmetic, and the Sapling, Orchard and Ironwood point rules are checked by `Transaction::decompress` instead, with the same upstream checks the parse used to run. `Deref` targets `CompressedTransactionData`, so `sapling_bundle()` / `orchard_bundle()` / `ironwood_bundle()` and the `sapling_spends()` / `sapling_outputs()` / `orchard_actions()` / `ironwood_actions()` accessors yield the byte-tier types (`BundleBytes`, `SpendDescriptionBytes`, `OutputDescriptionBytes`, `ActionBytes`). `zcash_note_encryption::decrypts_successfully` returns `Result<bool, DecompressionError>`, so a broken point is not reported as an undecryptable output.'
time: 2026-09-22T12:00:00.000000000Z
